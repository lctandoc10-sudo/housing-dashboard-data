<style>
/* Layout: industrial control-room app — steel app bar, side rail on desktop, bottom-safe drawer on phones, dense data panels */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #1b2430; --muted: #5d6978; --line: #d7dde4;
  --steel: #23384f; --steel-2: #2f5277; --amber: #e8a317; --amber-ink: #5a3d00;
  --ok: #217a3c; --ok-bg: #e2f2e6; --warn: #a65e00; --warn-bg: #fff0d4; --bad: #b42318; --bad-bg: #fde6e3; --info: #1f5f9e; --info-bg: #e1edf9; --plum: #6b3fa0; --plum-bg: #efe6f8; --grey-bg: #e8ecf0;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --top: 56px; --rail: 220px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171e; --panel: #19212b; --ink: #e4e9ef; --muted: #98a5b4; --line: #2b3643;
  --steel: #16273a; --steel-2: #6aa2d8; --amber: #f2b632; --amber-ink: #241800;
  --ok: #6fcf8a; --ok-bg: #173523; --warn: #f0b259; --warn-bg: #3a2a10; --bad: #ff8a7d; --bad-bg: #3d1c19; --info: #8cc0f2; --info-bg: #15304b; --plum: #c7a3f0; --plum-bg: #2d2140; --grey-bg: #26303b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171e; --panel: #19212b; --ink: #e4e9ef; --muted: #98a5b4; --line: #2b3643;
  --steel: #16273a; --steel-2: #6aa2d8; --amber: #f2b632; --amber-ink: #241800;
  --ok: #6fcf8a; --ok-bg: #173523; --warn: #f0b259; --warn-bg: #3a2a10; --bad: #ff8a7d; --bad-bg: #3d1c19; --info: #8cc0f2; --info-bg: #15304b; --plum: #c7a3f0; --plum-bg: #2d2140; --grey-bg: #26303b; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--steel); }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; } h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: .5rem; } h3 { font-size: 1rem; font-weight: 600; }
a { color: var(--steel-2); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); background: var(--steel); color: #fff; display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .mark { width: 26px; height: 26px; border-radius: 5px; background: var(--amber); color: #2a1c00; display: grid; place-items: center; font-size: .9rem; }
.preview-tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; background: rgba(255,255,255,.14); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.bar .grow { flex: 1; }
.bar .who { font-size: .85rem; background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 16px; padding: 6px 12px; cursor: pointer; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .report { background: var(--amber); color: #2a1c00; border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.menu-btn { display: none; background: none; border: 0; color: #fff; font-size: 1.4rem; width: 44px; height: 44px; cursor: pointer; }

.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 0 30px; }
.rail .grp { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 14px 18px 4px; }
.rail button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 9px 18px; cursor: pointer; font-size: .95rem; }
.rail button:hover { background: var(--grey-bg); }
.rail button.on { border-left-color: var(--amber); background: var(--grey-bg); font-weight: 700; }
main { min-width: 0; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 35; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: 0; left: 0; width: 260px; transform: translateX(-105%); transition: transform .2s; overflow-y: auto; padding-left: env(safe-area-inset-left, 0px); padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
  .rail.open { transform: none; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .menu-btn { display: inline-block; }
  .preview-tag, .brand .txt { display: none; }
  .bar .report span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* page parts */
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin-bottom: 14px; }
.head .sub { color: var(--muted); font-size: .92rem; width: 100%; }
.head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.stack { display: grid; gap: 14px; }
.cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.note { background: var(--info-bg); color: var(--info); border-radius: 6px; padding: 10px 12px; font-size: .9rem; }
.note.warn { background: var(--warn-bg); color: var(--warn); } .note.bad { background: var(--bad-bg); color: var(--bad); } .note.ok { background: var(--ok-bg); color: var(--ok); }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--steel-2); }
.btn.pri { background: var(--steel-2); border-color: var(--steel-2); color: #fff; }
:root[data-theme="dark"] .btn.pri, :root:not([data-theme="light"]) .btn.pri { color: var(--panel); }
.btn.go { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn.big { width: 100%; min-height: 54px; font-size: 1.05rem; }

/* KPI tiles */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.kpi { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px 16px; cursor: pointer; position: relative; min-height: 100px; }
.kpi::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--line); }
.kpi.ok::before { background: var(--ok); } .kpi.warn::before { background: var(--warn); } .kpi.bad::before { background: var(--bad); }
.kpi:hover { border-color: var(--steel-2); }
.kpi .lbl { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.kpi .lbl em { font-style: normal; font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; }
.kpi .val { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .val small { font-family: var(--f-body); font-size: .85rem; font-weight: 500; color: var(--muted); }
.kpi .ft { font-size: .76rem; color: var(--muted); font-family: var(--f-mono); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--grey-bg); }
tr.flag-bad td:first-child { box-shadow: inset 4px 0 0 var(--bad); } tr.flag-warn td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
td.r, th.r { text-align: right; }
.pill { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; background: var(--grey-bg); color: var(--muted); }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); } .p-bad { background: var(--bad-bg); color: var(--bad); }
.p-info { background: var(--info-bg); color: var(--info); } .p-plum { background: var(--plum-bg); color: var(--plum); }

/* forms */
.fg { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.fg .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
input, select, textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 8px 10px; }
textarea { min-height: 76px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1 1 auto; min-height: 46px; border: 0; border-right: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 700; color: var(--muted); padding: 6px 12px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--steel-2); color: var(--panel); }
.seg button.on.crit { background: var(--bad); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 5px 12px; cursor: pointer; font-size: .86rem; font-weight: 600; }
.chip.on { background: var(--steel); color: #fff; border-color: var(--steel); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar input[type=search] { max-width: 320px; }

/* detail */
.kv { display: grid; grid-template-columns: minmax(110px, 36%) minmax(0, 1fr); gap: 6px 12px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 12px 18px; border-left: 2px solid var(--line); margin-left: 5px; font-size: .88rem; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--steel-2); }
.back { background: none; border: 0; color: var(--steel-2); cursor: pointer; padding: 0; font-weight: 600; margin-bottom: 8px; }
.qr { background: #fff; padding: 8px; border-radius: 6px; width: 148px; height: 148px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { font-size: .72rem; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; letter-spacing: .06em; }
.cal .d { min-height: 86px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px; font-size: .72rem; overflow: hidden; min-width: 0; }
.cal .d.out { opacity: .45; } .cal .d.today { outline: 2px solid var(--amber); }
.cal .n { font-family: var(--f-mono); color: var(--muted); }
.cal .ev { display: block; border-radius: 3px; padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--info-bg); color: var(--info); }
.cal .ev.done { background: var(--ok-bg); color: var(--ok); } .cal .ev.late { background: var(--bad-bg); color: var(--bad); } .cal .ev.fc { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
@media (max-width: 600px) { .cal .d { min-height: 54px; } .cal .ev { font-size: .6rem; } }

.chart { position: relative; height: 240px; }

/* modal + toast */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,14,22,.55); display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--panel); border-radius: 10px; width: min(620px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; } .modal header .x { margin-left: auto; background: none; border: 0; font-size: 1.2rem; cursor: pointer; width: 40px; height: 40px; }
.modal .body { padding: 16px; display: grid; gap: 12px; }
.modal footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.formula { font-family: var(--f-mono); font-size: .84rem; background: var(--grey-bg); border-radius: 6px; padding: 9px 11px; }
#toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--steel); color: #fff; padding: 11px 14px; border-radius: 6px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.ok { background: var(--ok); color: var(--panel); } .toast.err { background: var(--bad); color: var(--panel); }

/* login */
.login { max-width: 980px; margin: 4vh auto; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 12px; }
.login .big-mark { width: 52px; height: 52px; border-radius: 10px; background: var(--steel); color: var(--amber); display: grid; place-items: center; font-size: 1.5rem; }
.acct { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.acct:hover { border-color: var(--steel-2); }
.acct b { font-family: var(--f-mono); font-weight: 600; font-size: .86rem; }
.checks { list-style: none; margin: 0; padding: 0; font-size: .85rem; display: grid; gap: 2px; }
.checks li.y { color: var(--ok); }
</style>

<div id="toasts" aria-live="polite"></div>

function modal(title, bodyHtml, actions = [{ label: 'Close' }], onMount) {

  const close = () => sc.remove();
  sc.querySelector('.x').onclick = close;
  sc.addEventListener('mousedown', e => { if (e.target === sc) close(); });
  const ft = sc.querySelector('footer');
  for (const a of actions) {
    const b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = () => { if (!a.fn) return close(); const keep = a.fn(sc); if (keep !== false) close(); };
    ft.appendChild(b);
  }
  document.body.appendChild(sc);
  onMount && onMount(sc);
  const f = sc.querySelector('input,select,textarea'); if (f) f.focus();
  return sc;
}

function pwChecks(pw) { return [[pw.length >= 8, 'At least 8 characters'], [/[A-Za-z]/.test(pw), 'Contains letters'], [/\d/.test(pw), 'Contains numbers'], [pw.length >= 12 || /[^A-Za-z0-9]/.test(pw), 'Recommended: 12+ characters or a symbol']]; }

function nextActions(w) {
  const a = [];
  const assigned = (w.assigned_to || '').includes(S.user.full_name);
  const exec = can('execute') && assigned || can('assign');
  switch (w.status) {
    case 'REPORTED': case 'SCHEDULED': case 'UNDER_ASSESSMENT': if (can('assign')) a.push(['assign', 'Assign technician', 'pri']); if (can('assign')) a.push(['CANCELLED', 'Cancel', '']); break;
    case 'ASSIGNED': if (exec) a.push(['IN_PROGRESS', 'Start work', 'pri']); break;
    case 'IN_PROGRESS': if (exec) { a.push([w.wo_type === 'CM' ? 'FOR_TESTING' : 'submit', w.wo_type === 'CM' ? 'Repair done – for testing' : 'Submit for verification', 'pri']); a.push(['WAITING_PARTS', 'Waiting for parts', '']); } break;
    case 'WAITING_PARTS': case 'WAITING_EXTERNAL': if (exec) a.push(['IN_PROGRESS', 'Resume work', 'pri']); break;
    case 'FOR_TESTING': if (exec) a.push(['submit', 'Submit for verification', 'pri']); break;
    case 'FOR_VERIFICATION': if (can('close')) { a.push(['CLOSED', 'Verify & close', 'go']); a.push(['rework', 'Return for rework', '']); } break;
  }
  return a;
}

  if (map[to]) { a.status = map[to]; a.status_reason = `${w.wo_number}: ${w.title}`; a.status_since = nowIso(); }
  if ((to === 'CLOSED' || to === 'CANCELLED') && !S.wos.some(x => x !== w && x.asset_id === a.id && isOpen(x) && ['IN_PROGRESS', 'WAITING_PARTS', 'FOR_TESTING', 'FOR_VERIFICATION', 'REPORTED'].includes(x.status))) { a.status = 'AVAILABLE'; a.status_reason = 'Returned to service'; a.status_since = nowIso(); }
}

function doAction(w, act) {
  const redraw = () => vWoDetail(document.getElementById('main'));
  if (act === 'assign') {
    const techs = S.users.filter(u => ['TECHNICIAN', 'SUPERVISOR'].includes(u.role_code) && u.is_active);
    return modal(`Assign ${w.wo_number}`, `<label class="f">Technician<select id="as">${techs.map(t => `<option>${esc(t.full_name)}</option>`).join('')}</select></label>`, [{ label: 'Cancel' }, { label: 'Assign', cls: 'pri', fn: sc => { w.assigned_to = sc.querySelector('#as').value; setStatus(w, 'ASSIGNED', `Assigned to ${w.assigned_to}`); toast('Assigned', 'ok'); redraw(); } }]);
  }
  if (act === 'CANCELLED' || act === 'rework') {
    return modal(act === 'rework' ? 'Return for rework' : 'Cancel work order', `<label class="f">Reason (required)<textarea id="rs"></textarea></label>`, [{ label: 'Back' }, { label: act === 'rework' ? 'Return for rework' : 'Cancel work order', cls: 'danger', fn: sc => {
      const r = sc.querySelector('#rs').value.trim(); if (r.length < 5) { toast('A reason is required', 'err'); return false; }
      setStatus(w, act === 'rework' ? 'IN_PROGRESS' : 'CANCELLED', r); w._submittedBy = null; redraw(); } }]);
  }
  if (act === 'IN_PROGRESS') { if (!w.actual_start) w.actual_start = nowIso(); setStatus(w, 'IN_PROGRESS'); toast('Work started – equipment is now under maintenance', 'ok'); return redraw(); }
  if (act === 'WAITING_PARTS') { setStatus(w, 'WAITING_PARTS', 'Parts requested from stores'); toast('Marked waiting for parts – stores notified', 'ok'); return redraw(); }
  if (act === 'FOR_TESTING' || act === 'submit') {
    const cm = w.wo_type === 'CM';
    const needTest = act === 'submit';
    return modal(act === 'FOR_TESTING' ? 'Repair done – record details' : 'Submit for verification', `
      <div class="note">A work order is not resolved just because it was updated. These fields are required before it can be verified.</div>
      <div class="fg"><label class="f full">Work performed<textarea id="wp">${esc(w.work_performed || '')}</textarea></label>
      <label class="f">Labor hours<input id="lh" type="number" step="0.5" value="${w.labor_h || ''}"></label>
      ${cm ? `<label class="f">Root cause<select id="rc"><option value="">— select —</option>${DATA.rootcauses.map(r => `<option value="${r.code}" ${w.root_cause_code === r.code ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></label>
      <label class="f">Failed component<input id="fc" value="${esc(w.failed_component || '')}"></label><label class="f full">Repair action<textarea id="ra2">${esc(w.repair_action || '')}</textarea></label>` : `<label class="f">Condition after<select id="ca"><option>Good / serviceable</option><option>Serviceable – monitor</option><option>Not serviceable – corrective work required</option></select></label>`}
      ${needTest ? `<label class="f full">Test results<textarea id="tr">${esc(w.test_results || '')}</textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="tp" style="width:20px;min-height:20px"> Functional test passed</label>` : ''}</div>`,
    [{ label: 'Back' }, { label: act === 'FOR_TESTING' ? 'Mark for testing' : 'Submit', cls: 'pri', fn: sc => {
      const q = id => sc.querySelector(id); const missing = [];
      if (!q('#wp').value.trim()) missing.push('work performed');
      if (!(+q('#lh').value > 0)) missing.push('labor hours');
      if (cm && !q('#rc').value) missing.push('root cause');
      if (cm && !q('#fc').value.trim()) missing.push('failed component');
      if (cm && !q('#ra2').value.trim()) missing.push('repair action');
      if (needTest && !q('#tr').value.trim()) missing.push('test results');
      if (needTest && !q('#tp').checked) missing.push('passed functional test');
      if (missing.length) { toast('Missing: ' + missing.join(', '), 'err'); return false; }
      Object.assign(w, { work_performed: q('#wp').value, labor_h: +q('#lh').value });
      if (cm) Object.assign(w, { root_cause_code: q('#rc').value, failed_component: q('#fc').value, repair_action: q('#ra2').value }); else w.condition_after = q('#ca').value;
      if (needTest) w.test_results = q('#tr').value;
      if (!w.actual_end) w.actual_end = nowIso();
      if (act === 'FOR_TESTING') setStatus(w, 'FOR_TESTING'); else { setStatus(w, 'FOR_VERIFICATION', 'Submitted'); w._submittedBy = S.user.full_name; }
      toast(act === 'FOR_TESTING' ? 'Ready for testing' : 'Submitted – supervisors notified for verification', 'ok'); redraw(); } }]);
  }
  if (act === 'CLOSED') {
    if (w._submittedBy === S.user.full_name || (w.assigned_to || '').includes(S.user.full_name)) return toast('Independent verification required: you did this work, so another authorised person must verify and close it.', 'err');
    return modal(`Verify & close ${w.wo_number}`, `<div class="note">Closing confirms the work was checked and returns the equipment to service.</div><label class="f">Remarks<textarea id="vr">Verified on site</textarea></label>`,
      [{ label: 'Back' }, { label: 'Verify & close', cls: 'go', fn: () => { w.closed_at = nowIso(); setStatus(w, 'CLOSED', 'Verified'); toast(`${w.wo_number} closed – ${w.asset_code} returned to service`, 'ok'); redraw(); } }]);
  }
}

// ------------------------------------------------------------ PMS
function vPms(m) {
  const first = today.slice(0, 8) + '01';
  const wd = new Date(first + 'T00:00:00Z').getUTCDay();
  const start = new Date(Date.parse(first + 'T00:00:00Z') - ((wd + 6) % 7) * 864e5);
  const ev = {};
  const cal = DATA.calendar;
  for (const w of cal.work_orders) (ev[w.due_date] = ev[w.due_date] || []).push(`<span class="ev ${w.category === 'DONE' ? 'done' : w.category === 'MISSED' || ((w.category === 'OPEN' || w.category === 'HOLD') && w.due_date < today) ? 'late' : ''}" title="${esc(w.wo_number + ' ' + w.title)}">${esc(w.asset_code)} · ${esc(w.title)}</span>`);
  for (const f of cal.forecast) (ev[f.due_date] = ev[f.due_date] || []).push(`<span class="ev fc" title="Forecast">${esc(f.asset_code)} · ${esc(f.title)}</span>`);
  let cells = '';
  for (let i = 0; i < 42; i++) { const d = new Date(start.getTime() + i * 864e5).toISOString().slice(0, 10); cells += `<div class="d ${d.slice(0, 7) !== today.slice(0, 7) ? 'out' : ''} ${d === today ? 'today' : ''}"><div class="n">${+d.slice(8)}</div>${(ev[d] || []).join('')}</div>`; }
  const month = new Date(first + 'T00:00:00Z').toLocaleDateString('en-PH', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const freq = p => `Every ${num(p.interval_value, 0)} ${{ DAILY: 'day', WEEKLY: 'week', MONTHLY: 'month', QUARTERLY: 'quarter', SEMIANNUAL: 'half-year', ANNUAL: 'year', CUSTOM_DAYS: 'days', HOURS: 'operating hours', KM: 'km' }[p.frequency]}`;
  m.innerHTML = `<div class="head"><h1>PMS calendar – ${month}</h1><div class="sub">Generated PMS work orders and forecast occurrences (dashed). Work orders are created automatically when a schedule reaches its lead window, and the next cycle is set only when a PMS is completed or marked missed.</div></div>
    <div class="stack"><div class="chips"><span class="pill p-info">Open</span><span class="pill p-ok">Completed</span><span class="pill p-bad">Overdue / missed</span><span class="pill">Forecast</span></div>
    <div class="tw"><div class="cal" style="min-width:560px">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div>
    <div class="panel"><h2>PMS plans</h2><div class="tw"><table><thead><tr><th>Code</th><th>Plan</th><th>Applies to</th><th>Frequency</th><th class="r">Equipment</th><th>Next due</th></tr></thead><tbody>
      ${DATA.plans.map(p => `<tr><td class="mono">${esc(p.code)}</td><td>${esc(p.name)}</td><td>All ${esc(p.category)}</td><td>${freq(p)}</td><td class="r num">${p.schedules}</td><td>${p.next_due ? fd(p.next_due) : (p.frequency === 'HOURS' || p.frequency === 'KM' ? 'By meter reading' : '—')}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
}

      <label class="f">Role<select id="nur">${DATA.roles.map(r => `<option value="${r.code}" ${r.code === 'TECHNICIAN' ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
      <label class="f">Sites<select id="nus"><option value="">All sites</option>${DATA.sites.map(s => `<option value="${s.code}">${esc(s.name)}</option>`).join('')}</select></label>
      <label class="f full">Temporary password<div style="display:flex;gap:6px"><input id="nup" class="mono" value="${pw}"><button class="btn sm" type="button" id="g">Generate</button></div></label></div><div id="nuc">${checksHtml(pw)}</div>
      <div class="muted" style="font-size:.85rem">Give the password to the user securely. They must change it at first sign-in.</div>`,
    [{ label: 'Cancel' }, { label: 'Create user', cls: 'pri', fn: sc => {
      const q = id => sc.querySelector(id).value.trim();
      if (!/^[A-Za-z0-9._-]{3,40}$/.test(q('#nuu'))) { toast('Username: 3–40 letters, digits, dot, dash or underscore', 'err'); return false; }
      if (S.users.some(u => u.username.toLowerCase() === q('#nuu').toLowerCase())) { toast('That username already exists', 'err'); return false; }
      if (!q('#nun')) { toast('Full name is required', 'err'); return false; }
      if (!pwValid(q('#nup'))) { toast('Password needs 8+ characters with letters and numbers', 'err'); return false; }
      const role = DATA.roles.find(r => r.code === q('#nur'));
      S.users.push({ id: Math.max(...S.users.map(u => u.id)) + 1, username: q('#nuu'), full_name: q('#nun'), role_code: role.code, role_name: role.name, all_sites: q('#nus') ? 0 : 1, sites: q('#nus'), is_active: 1, must_change_password: 1, pw: q('#nup') });
      toast(`User ${q('#nuu')} created. Sign out and sign in as them to see the forced password change.`, 'ok'); draw(); } }],
    sc => { const inp = sc.querySelector('#nup'); inp.oninput = () => sc.querySelector('#nuc').innerHTML = checksHtml(inp.value); sc.querySelector('#g').onclick = () => { inp.value = genPw(); inp.oninput(); }; });
  };
}

function vProfile(m) {
  const u = S.user;
  m.innerHTML = `<div class="head"><h1>My profile</h1><div class="sub">Account details and password</div></div>
    ${u.must_change_password ? '<div class="note warn" style="margin-bottom:14px">You must set a new password before continuing. This happens at first sign-in and after the administrator resets your password.</div>' : ''}
    <div class="cols"><div class="panel"><h2>Account</h2><dl class="kv"><dt>Name</dt><dd>${esc(u.full_name)}</dd><dt>Username</dt><dd class="mono">${esc(u.username)}</dd><dt>Role</dt><dd>${esc(u.role_name)}</dd><dt>Position</dt><dd>${esc(u.position || '—')}</dd><dt>Sites</dt><dd>${u.all_sites ? 'All sites' : esc(u.sites || '—')}</dd></dl></div>
    <form class="panel stack" id="pf"><h2 style="margin:0">Change password</h2>
      <label class="f">Current password<input type="password" id="pc" autocomplete="current-password"></label>
      <label class="f">New password<input type="password" id="pn" autocomplete="new-password"></label><div id="pk">${checksHtml('')}</div>
      <label class="f">Confirm new password<input type="password" id="pr" autocomplete="new-password"></label>
      <button class="btn pri" type="submit">Change password</button></form></div>`;
  pn.oninput = () => pk.innerHTML = checksHtml(pn.value);
  pf.onsubmit = e => {
    e.preventDefault();
    if (pc.value !== u.pw) return toast('Current password is incorrect', 'err');
    if (!pwValid(pn.value)) return toast('New password needs 8+ characters with letters and numbers', 'err');
    if (pn.value === pc.value) return toast('New password must be different', 'err');
    if (pn.value !== pr.value) return toast('New password and confirmation do not match', 'err');
    const forced = u.must_change_password;
    u.pw = pn.value; u.must_change_password = 0;
    toast('Password changed. Your other sessions were signed out.', 'ok');
    if (forced) { renderShell(); go(can('dash') ? 'dashboard' : can('execute') ? 'wo' : 'avail'); } else vProfile(m);
  };
}

renderLogin();
</script>

</body>
</html>
