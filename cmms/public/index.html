<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Precast CMMS</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4e79'/%3E%3Cpath d='M8 22h16M10 22V12l6-4 6 4v10' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <a href="#/dashboard" class="brand"><span class="logo">▲</span> <span class="brand-text">Precast CMMS</span></a>

  </header>
  <nav id="sidenav" hidden></nav>
  <div id="navBackdrop" hidden></div>
  <main id="view"><div class="loading">Loading…</div></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/vendor/chart.umd.js"></script>
<script type="module" src="/js/app.js"></script>

</html>
